name: Short giornaliero

on:
  schedule:
    - cron: "40 5 * * *" # ogni mattina (07:40 ora italiana d'estate, 06:40 d'inverno)
  workflow_dispatch:
    inputs:
      topic:
        description: "Argomento (vuoto = trend del giorno)"
        required: false
      upload:
        description: "Caricare su YouTube?"
        type: boolean
        default: true

concurrency: short-giornaliero

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'AI SPIEGATA' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: content-engine/requirements.txt

      - name: Installa FFmpeg e font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - run: pip install -r content-engine/requirements.txt

      - name: Crea lo Short
        env:
          TOPIC: ${{ inputs.topic }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          ARGS=()
          if [ -n "$TOPIC" ]; then ARGS+=(--topic "$TOPIC"); fi
          # il caricamento parte solo se le credenziali YouTube sono configurate
          if [ -n "$YT_REFRESH_TOKEN" ] && [ "$UPLOAD" != "false" ]; then ARGS+=(--upload); fi
          python content-engine/run.py "${ARGS[@]}"

      - name: Allega il video al run (scaricabile per 7 giorni)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: content-engine/output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Salva lo storico degli argomenti
        run: |
          git config user.name "content-engine"
          git config user.email "content-engine@users.noreply.github.com"
          git add content-engine/data/history.json
          git diff --cached --quiet || (git commit -m "Storico Short: $(date +%F)" && git pull --rebase && git push)
